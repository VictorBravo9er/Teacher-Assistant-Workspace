<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 170" fill="none">
<title>Teach&amp;Learn Logo</title>
<defs>
<rect id="bg" x="0" y="0" width="240" height="170" fill="white"/>
<rect
id="base"
x="-0.5" y="-0.5" width="1" height="1" rx="0.1"
transform="translate(120, 70) scale(160, 64) rotate(45)"/>
<mask id="cut-gap">
<use href="#bg"/>
<use href="#base" transform="translate(0,-20)" fill="black"/>
</mask>
<mask id="cut-r">
<use href="#bg"/>
<rect fill="black" width="10" height="20" x="-5" y="-5"
transform="translate(86,86) rotate(-40) scale(1,8)"/>
</mask>
<mask id="cut-l">
<use href="#bg"/>
<rect fill="black" width="140" height="100" x="-5" y="-5"
transform="translate(86,86) rotate(-40) scale(1,8)" />
</mask>
</defs>
<g id="logo">
<g mask="url(#cut-gap)" transform="translate(0,-10)">
<use href="#base" fill="#10b981" transform="translate(0,-2)"/>
</g>
<g mask="url(#cut-gap)" transform="translate(0,20)">
<use
href="#base"
fill="#0d9488"
mask="url(#cut-r)"/>
<use
href="#base"
fill="#64748b"
mask="url(#cut-l)"/>
</g>
</g>
</svg>
