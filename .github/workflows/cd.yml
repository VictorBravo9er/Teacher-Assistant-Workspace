name: CD Pipeline (Database Migrations & Edge Functions)

on:
  push:
    branches:
      - main

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy-supabase:
    name: Deploy Database Migrations & Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js (for Supabase CLI)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dotenv
        run: pip install dotenv

      - name: Run Database Migrations
        run: |
          python scripts/migrate.py --yes --no-types

      - name: Deploy Modified Edge Functions
        run: |
          python scripts/deploy_edge_functions.py

      - name: Commit Updated Deployment Manifest
        run: |
          if [ -n "$(git status --porcelain supabase/functions/deployed.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add supabase/functions/deployed.json
            git commit -m "chore(edge-functions): update deployed.json manifest [skip ci]"
            git push
          else
            echo "No changes to deployed.json"
          fi
