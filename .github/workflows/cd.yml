name: CD Pipeline (Database Migrations & Edge Functions)

on:
  push:
    branches:
      - main

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  migrate-database:
    name: Apply Database Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (for Supabase CLI)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Run Database Migrations
        env:
          POSTGRES_URI: ${{ secrets.POSTGRES_URI }}
        run: |
          uv run scripts/migrate.py --yes

  deploy-edge-functions:
    name: Deploy Supabase Edge Functions
    needs: [migrate-database]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js (for Supabase CLI)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Deploy Modified Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          uv run scripts/deploy_edge_functions.py

      - name: Commit Updated Deployment Manifest
        run: |
          if [ -n "$(git status --porcelain supabase/functions/deployed.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add supabase/functions/deployed.json
            git commit -m "chore(edge-functions): update deployed.json manifest [skip ci]"
            git push
          else
            echo "No changes to deployed.json"
          fi
