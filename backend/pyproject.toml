[project]
name = "didactiq-backend"
version = "0.1.0"
description = "FastAPI backend using LangChain & OpenRouter for Didactiq"
readme = "AGENTS.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-openai>=0.0.8",
    "pydantic-settings>=2.14.2",
    "langchain-openrouter>=0.2.6",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "basedpyright>=1.38.3",
    "poethepoet>=0.25.0",
    "uvicorn>=0.28.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "httpx>=0.28.1",
]

[tool.poe.tasks]
run-dev = "uvicorn src.main:app --reload --host 0.0.0.0 --port 8000"
lint = { shell = "ruff check . && basedpyright --level error && python ../scripts/verify_doc_coverage.py backend" }
format = "ruff format ."
test = "pytest"
test-live = { shell = "DIDACTIQ_TEST_MODE=live pytest -v" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: requires live PostgreSQL (ai/langgraph schemas) and/or OpenRouter API credentials",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
exclude = [
    ".venv",
    ".vercel",
    "src/types/db.py",
]

[tool.ruff.lint]
per-file-ignores = { "src/types/db.py" = ["ALL"], "tests/*.py" = ["E402"] }

[tool.basedpyright]
typeCheckingMode = "standard"
failOnWarnings = false
include = ["src"]
exclude = [
    "**/__pycache__",
    ".venv",
    ".vercel",
    "src/types/db.py",
]
ignore = [
    "src/types/db.py",
]
