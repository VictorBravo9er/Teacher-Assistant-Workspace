# Production Docker Compose Configuration
# Usage: docker compose up -d

services:
  # ==========================================
  # Backend API Service
  # ==========================================
  backend:
    image: ta-backend
    container_name: ta-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
      args:
        # Match container user ID to host user ID for file permission compatibility
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-8090}
      - OPENROUTER_API_KEY
      - OPENROUTER_MODEL
    expose:
      # Expose only to other containers on the internal Docker network
      - "${BACKEND_PORT:-8090}"
    restart: unless-stopped

  # ==========================================
  # Frontend Web Service (Nginx)
  # ==========================================
  frontend:
    image: ta-frontend
    container_name: ta-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        # Vite requires these at build-time to bake them into the static assets
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    ports:
      # Expose the frontend to the host machine
      - "${HOST_PORT:-80}:${FRONTEND_PORT:-8080}"
    environment:
      # These are used by Nginx at runtime to substitute variables in default.conf.template
      - FRONTEND_PORT=${FRONTEND_PORT:-8080}
      - BACKEND_PORT=${BACKEND_PORT:-8090}
      - BACKEND_HOST=backend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
