# Development Override Configuration
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # ==========================================
  # Local Supabase Lifecycle Service
  # ==========================================
  supabase:
    image: ta-supabase-dev
    container_name: ta-supabase-dev
    build:
      context: ./supabase
      dockerfile: Dockerfile.dev
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:${PWD}
    working_dir: ${PWD}
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "npx --yes supabase status >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped

  # ==========================================
  # Backend API Service (Dev Override)
  # ==========================================
  backend:
    image: ta-backend-dev
    container_name: ta-backend-dev
    build:
      target: dev
    ports:
      # Expose backend port directly to host for local testing / Swagger UI
      - "${BACKEND_PORT:-8090}:${BACKEND_PORT:-8090}"
    volumes:
      # Mount source code for live-reloading (read-only for security)
      - ./backend/src:/app/src:ro
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LOG_MAX_ENTRIES=${LOG_MAX_ENTRIES:-5000}
      - POSTGRES_URI=${DEV_POSTGRES_URI:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      - DB_OPTIONS=${DEV_DB_OPTIONS:--c%20search_path%3Dlanggraph}
      - SUPABASE_URL=${DEV_SUPABASE_URL:-http://host.docker.internal:54321}
      - SUPABASE_SERVICE_ROLE_KEY=${DEV_SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
    depends_on:
      supabase:
        condition: service_healthy

  # ==========================================
  # Frontend Web Service (Dev Override)
  # ==========================================
  frontend:
    image: ta-frontend-dev
    container_name: ta-frontend-dev
    build:
      target: dev
    # Note: Startup command (pnpm run dev) is safely baked into the Dockerfile dev stage
    volumes:
      # Mount source files explicitly to avoid host node_modules conflicts
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-DEBUG}
      - VITE_LOG_MAX_ENTRIES=${VITE_LOG_MAX_ENTRIES:-5000}
      - VITE_SUPABASE_URL=${DEV_VITE_SUPABASE_URL:-http://localhost:54321}
      - VITE_SUPABASE_PUBLISHABLE_KEY=${DEV_VITE_SUPABASE_PUBLISHABLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
    depends_on:
      supabase:
        condition: service_healthy
