# Development Override Configuration
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # ==========================================
  # Backend API Service (Dev Override)
  # ==========================================
  backend:
    image: ta-backend-dev
    container_name: ta-backend-dev
    build:
      target: dev
    ports:
      # Expose backend port directly to host for local testing / Swagger UI
      - "${BACKEND_PORT:-8090}:${BACKEND_PORT:-8090}"
    volumes:
      # Mount source code for live-reloading (read-only for security)
      - ./backend/src:/app/src:ro
      - ./logs:/app/logs
    environment:
      - LOG_MAX_ENTRIES=${LOG_MAX_ENTRIES:-5000}

  # ==========================================
  # Frontend Web Service (Dev Override)
  # ==========================================
  frontend:
    image: ta-frontend-dev
    container_name: ta-frontend-dev
    build:
      target: dev
    # Note: Startup command (npm run dev) is safely baked into the Dockerfile dev stage
    volumes:
      # Mount source files explicitly to avoid host node_modules conflicts
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./logs:/app/logs
    environment:
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-DEBUG}
      - VITE_LOG_MAX_ENTRIES=${VITE_LOG_MAX_ENTRIES:-5000}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
